<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Play Video</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Play Video">
    <meta name="twitter:description" content="New video">
    <meta name="twitter:image" content="https://i.imgur.com/f0LgJJl.jpeg">
    <meta name="twitter:image:alt" content="Play Video">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Play Video">
    <meta property="og:description" content="New video">
    <meta property="og:image" content="https://i.imgur.com/f0LgJJl.jpeg">
    <meta property="og:image:secure_url" content="https://i.imgur.com/f0LgJJl.jpeg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="675">
    <meta property="og:url" content="https://onlyfanis.url12xx.site/">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #030816;
            font-family: Arial, sans-serif;
        }

        .wrap {
            width: min(1000px, 96vw);
            margin: 30px auto;
        }

        .poster {
            display: block;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid #22324d;
            background: #0b1324;
        }

        .poster img {
            display: block;
            width: 100%;
            height: auto;
        }

        .button {
            display: block;
            width: fit-content;
            margin: 18px auto;
            padding: 12px 24px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="wrap">

        <!-- Image -->
        <a
            class="poster"
            href="https://onlyfanis.url12xx.site/"
        >
            <img
                src="https://i.imgur.com/f0LgJJl.jpeg"
                alt="Play Video"
            >
        </a>

        <!-- Destination -->
        <a
            class="button"
            href="https://onlyfanis.url12xx.site/"
        >
            Play Video
        </a>

    </div>

</body>
</html>
